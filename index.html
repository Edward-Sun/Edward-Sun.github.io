<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edward-Sun GitHub Pages</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24292f;
      background: #f6f8fa;
    }
    main {
      width: min(640px, calc(100vw - 48px));
      padding: 32px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      margin: 12px 0;
      line-height: 1.55;
    }
    a {
      color: #0969da;
    }
  </style>
</head>
<body>
  <main>
    <h1>Edward-Sun GitHub Pages</h1>
    <p>The previous custom-domain redirect has been removed from this GitHub Pages root.</p>
    <p>The content repository is <a href="https://github.com/Edward-Sun/Edward-Sun.github">Edward-Sun/Edward-Sun.github</a>. As a project Pages site, GitHub serves it at <a href="/Edward-Sun.github/">/Edward-Sun.github/</a> once Pages is enabled for that repository.</p>
  </main>
</body>
</html>
